<!doctype html>
<html lang="{{ 'zh-Hant' if ui_locale == 'zh_TW' else 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Erin Dojo</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
  {% for sheet in ["base", "hall", "gate", "trail", "sheet"] %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dojo/' ~ sheet ~ '.css') }}" />
  {% endfor %}
</head>
<body>
  <div class="hall">
    <div class="shoji" aria-hidden="true"></div>
    <div class="wrap">
      <div class="topbar" id="topbar"></div>
      <main id="app"></main>
    </div>
  </div>
  <script id="dojo-config" type="application/json">{{ dojo_config | tojson }}</script>
  <script type="module" src="{{ url_for('static', filename='js/dojo/main.js') }}"></script>
</body>
</html>
